name: Build and deploy Aseprite

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release info
        id: version_info
        shell: bash
        run: |
          data=$(curl -sL https://api.github.com/repos/aseprite/aseprite/releases/latest)

          LATEST_TAG=$(echo "$data" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$data" | jq -r '.zipball_url')
          VERSION_BODY=$(echo "$data" | jq -r '.body // ""')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to get latest Aseprite tag"
            echo "$data"
            exit 1
          fi

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Failed to get Aseprite zipball URL"
            echo "$data"
            exit 1
          fi

          echo "$LATEST_TAG" > latest-version.txt

          {
            echo "latest_tag=$LATEST_TAG"
            echo "download_url=$DOWNLOAD_URL"
            echo "version_body<<EOF"
            echo "$VERSION_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check version cache
        id: version_check
        uses: actions/cache@v4
        with:
          path: latest-version.txt
          key: aseprite-version-${{ steps.version_info.outputs.latest_tag }}
          lookup-only: true

      - name: Should we start new build?
        id: should_build
        shell: bash
        run: |
          if [ "${{ steps.version_check.outputs.cache-hit }}" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Already built ${{ steps.version_info.outputs.latest_tag }}"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Need to build ${{ steps.version_info.outputs.latest_tag }}"
          fi

  build-aseprite:
    name: Build Aseprite
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build == 'true' }}

    runs-on: windows-latest

    steps:
      - name: Install build tools
        shell: powershell
        run: |
          choco install ninja -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ninja --version

      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-m81-b607b32047

      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -o Skia-Windows-Release-X64.zip -L https://github.com/aseprite/skia/releases/download/m81-b607b32047/Skia-Windows-Release-X64.zip
          unzip Skia-Windows-Release-X64.zip -d skia

      - name: Download Aseprite source
        shell: bash
        run: |
          curl -o Aseprite-source.zip -L "${{ needs.check-version.outputs.download_url }}"
          unzip Aseprite-source.zip -d aseprite-src

          mkdir aseprite
          shopt -s dotglob
          mv aseprite-src/*/* aseprite/

          mkdir -p aseprite/build

      - name: Configure with CMake
        working-directory: aseprite/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          cmake ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=../../skia ^
            -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 ^
            -G Ninja ^
            ..

      - name: Build Aseprite
        working-directory: aseprite/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          ninja aseprite

      - name: Clean up build files
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          rm -f gen
          rm -f modp_b64_gen
          rm -f gen.exe
          rm -f gen.exe.manifest
          rm -f modp_b64_gen.exe
          rm -f modp_b64_gen.exe.manifest

      - name: Make portable build
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo "# This file is here so Aseprite behaves as a portable program" > aseprite.ini

      - name: Package release zip
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          7z a "Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip" *

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Release Aseprite ${{ needs.check-version.outputs.latest_tag }}
          draft: true
          prerelease: false
          files: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
