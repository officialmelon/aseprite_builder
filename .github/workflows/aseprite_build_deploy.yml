name: Build and deploy Aseprite

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if release already exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  BUILD_TYPE: RelWithDebInfo

  # Current Aseprite builds use the newer Skia package, not the old m81 one.
  SKIA_VERSION: m124-08a5439a6b
  SKIA_ZIP: Skia-Windows-Release-x64.zip
  SKIA_URL: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release info
        id: version_info
        shell: bash
        run: |
          data=$(curl -sL https://api.github.com/repos/aseprite/aseprite/releases/latest)

          LATEST_TAG=$(echo "$data" | jq -r '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to get latest Aseprite tag"
            echo "$data"
            exit 1
          fi

          echo "Latest Aseprite tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if our release already exists
        id: release_check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.latest_tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet."
          fi

      - name: Should we start new build?
        id: should_build
        shell: bash
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build == 'true' }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build enabled."
          elif [ "${{ steps.release_check.outputs.release_exists }}" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping build because release already exists."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Starting build."
          fi

  build-aseprite:
    name: Build Aseprite
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build == 'true' }}

    runs-on: windows-latest

    steps:
      - name: Install build tools
        shell: powershell
        run: |
          choco install ninja -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          ninja --version
          cmake --version
          git --version

      - name: Restore Skia cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-${{ env.SKIA_VERSION }}

      - name: Download Skia if not cached
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L -o "${{ env.SKIA_ZIP }}" "${{ env.SKIA_URL }}"
          unzip "${{ env.SKIA_ZIP }}" -d skia

          echo "Skia files:"
          find skia -maxdepth 3 -type f | head -50

      - name: Clone Aseprite source with submodules
        shell: bash
        run: |
          git clone --recursive --depth 1 --branch "${{ needs.check-version.outputs.latest_tag }}" https://github.com/aseprite/aseprite.git aseprite

          cd aseprite

          # Extra safety: make sure all submodules are really initialized.
          git submodule update --init --recursive

          mkdir -p build

          echo "Aseprite source files:"
          ls -la

          echo "Submodule status:"
          git submodule status --recursive

      - name: Configure with CMake
        working-directory: aseprite/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          cmake ^
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
            -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/;C:/msys64/mingw64/bin/;C:/msys64/usr/bin/" ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=../../skia ^
            -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 ^
            -DSKIA_LIBRARY=../../skia/out/Release-x64/skia.lib ^
            -G Ninja ^
            ..

      - name: Build Aseprite
        working-directory: aseprite/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          ninja aseprite

      - name: Clean up helper build files
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          rm -f gen
          rm -f modp_b64_gen
          rm -f gen.exe
          rm -f gen.exe.manifest
          rm -f modp_b64_gen.exe
          rm -f modp_b64_gen.exe.manifest

      - name: Make portable build
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo "# This file is here so Aseprite behaves as a portable program" > aseprite.ini

      - name: Package release zip
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          7z a "Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip" *

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Release Aseprite ${{ needs.check-version.outputs.latest_tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
